name: release

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: Recipes to release, space-separated (e.g. `php neon-proxy`)
        required: true

concurrency:
  group: release

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      recipes: ${{ inputs.recipes }}
