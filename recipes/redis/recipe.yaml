name: redis
version: 8.12.0
revision: 0
description: Redis server and CLI, for local development and tests
homepage: https://redis.io
license: AGPL-3.0-only OR SSPL-1.0 OR LicenseRef-RSALv2
source:
  url: https://download.redis.io/releases/redis-{version}.tar.gz
  sha256: "b0100a879b2d45dc97d8fda941127609d648f8913008db1b65a2f72a8ae36c8b"
binaries: [redis-server, redis-cli, redis-benchmark, redis-check-aof, redis-check-rdb, redis-sentinel]
targets: [macos-arm64, linux-x64, linux-arm64]
build-deps:
  apt: [build-essential]
test: [redis-server --version, "^Redis server v={version} "]
updates:
  - field: .version
    type: git-tag
    repo: https://github.com/redis/redis.git
    pattern: ^([0-9]+\.[0-9]+\.[0-9]+)$
