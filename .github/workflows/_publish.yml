name: publish

on:
  workflow_call:
    inputs:
      builds:
        type: string
        required: true
      recipes:
        type: string
        required: true
      sha:
        type: string
        required: true
      promote:
        description: After releasing, cherry-pick the built commit onto main
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.recipes) }}
    name: release (${{ matrix.tag }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      RECIPE: ${{ matrix.recipe }}
      TAG: ${{ matrix.tag }}
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.recipe }}-*
          path: dist
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish
        run: |
          {
            echo "$(bin/recipe "$RECIPE" .description)."
            echo
            echo "Built from [\`recipes/$RECIPE\`](https://github.com/$GITHUB_REPOSITORY/tree/$SHA/recipes/$RECIPE). Upstream: $(bin/recipe "$RECIPE" .homepage) ($(bin/recipe "$RECIPE" .license))."
            echo
            echo '```sh'
            echo "mise use github:$GITHUB_REPOSITORY@$TAG"
            echo '```'
          } > notes.md
          cat notes.md
          ls -l dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "$TAG" --notes-file notes.md dist/*.tar.gz dist/*.sha256

  install:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.builds) }}
    name: install (${{ matrix.recipe }}, ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.test_container }}
    permissions:
      contents: read
      attestations: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RECIPE: ${{ matrix.recipe }}
    steps:
      - if: matrix.test_container != ''
        run: apt-get update -qq && apt-get install -y -qq git curl ca-certificates xz-utils >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - name: mise install from a project's mise.toml
        run: |
          tag="$(bin/recipe "$RECIPE" tag)"
          project="$RUNNER_TEMP/project" && mkdir -p "$project"
          printf '[tools]\n"github:%s" = "%s"\n' "$GITHUB_REPOSITORY" "$tag" > "$project/mise.toml"
          cat "$project/mise.toml"
          (cd "$project" && mise trust --yes mise.toml && mise install)
          bin/test "$RECIPE" "$(cd "$project" && mise where "github:$GITHUB_REPOSITORY")" --quick

  promote:
    needs: install
    if: inputs.promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch -q origin "$SHA"
          for attempt in 1 2 3; do
            git reset -q --hard origin/main
            git cherry-pick "$SHA"
            git push origin HEAD:main && exit 0
            echo "main moved; retrying ($attempt)"; git fetch -q origin main
          done
          exit 1
