name: redis
version: 8.10.3
revision: 0
description: Redis server and CLI with the JSON, Search, TimeSeries and Bloom modules, for local development and tests
homepage: https://redis.io
license: AGPL-3.0-only OR SSPL-1.0 OR LicenseRef-RSALv2
source:
  url: https://download.redis.io/releases/redis-{version}.tar.gz
  sha256: "edde778f6bdee7581e42fc139ca9e07e2822212092f7501f99989656e3629d02"
binaries: [redis-server, redis-cli, redis-benchmark, redis-check-aof, redis-check-rdb, redis-sentinel]
targets: [macos-arm64, linux-x64, linux-arm64]
build-deps:
  apt: [build-essential, libssl-dev, cmake, pkg-config, python3, patchelf]
  brew: [make, coreutils, openssl@3, cmake]
boost:
  tag: 1.88.0
  url: https://github.com/boostorg/boost/releases/download/boost-{tag}/boost-{tag}-b2-nodocs.tar.gz
  sha256: "85138e4a185a7e7535e82b011179c5b5fb72185bea9f59fe8e2d76939b2f5c51"
test: [redis-server --version, "^Redis server v={version} "]
updates:
  - field: .version
    type: git-tag
    repo: https://github.com/redis/redis.git
    pattern: ^([0-9]+\.[0-9]+\.[0-9]+)$
