name: neon-proxy
version: "8853"
revision: 1
description: Neon's proxy, with the postgres auth backend for local development
homepage: https://github.com/neondatabase/neon/tree/main/proxy
license: Apache-2.0
source:
  git: https://github.com/neondatabase/neon.git
  ref: release-proxy-{version}
  commit: 58abce0207943f44ac801aebc4f3d881e90a6894
binaries: [neon-proxy]
targets: [macos-arm64, linux-x64, linux-arm64]
build-deps:
  apt: [build-essential, protobuf-compiler, libssl-dev, pkg-config, cmake, clang]
  brew: [protobuf, cmake]
cache: rust
rustup:
  version: 1.29.3
  downloads:
    linux-x64:
      url: https://static.rust-lang.org/rustup/archive/{.rustup.version}/x86_64-unknown-linux-gnu/rustup-init
      sha256: "b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55"
    linux-arm64:
      url: https://static.rust-lang.org/rustup/archive/{.rustup.version}/aarch64-unknown-linux-gnu/rustup-init
      sha256: "9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282"
test: [neon-proxy --help, "possible values:.*postgres"]
test-postgres: postgres-18.7-1
updates:
  - field: .version
    type: git-tag
    repo: https://github.com/neondatabase/neon.git
    pattern: ^release-proxy-([0-9]+)$
  - field: .rustup.version
    type: git-tag
    repo: https://github.com/rust-lang/rustup.git
    pattern: ^([0-9]+\.[0-9]+\.[0-9]+)$
