name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: bin/validate

  recipes:
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      attestations: read
    with:
      recipes: >-
        ${{ github.event_name == 'workflow_dispatch' && 'all'
        || format('changed {0}', github.ref == 'refs/heads/main' && github.event.before || 'origin/main') }}
