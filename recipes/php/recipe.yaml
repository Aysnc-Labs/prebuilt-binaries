name: php
version: 8.5.13
revision: 0
description: PHP CLI and FPM with the extensions WordPress and Laravel use
homepage: https://www.php.net
license: PHP-3.01
binaries: [php, php-fpm]
targets: [macos-arm64, linux-x64, linux-arm64]
cache: dir
test: [php -v, "^PHP {version} "]
php-src:
  url: https://www.php.net/distributions/php-{version}.tar.xz
  sha256: "607602acaf0c3061818e9916ec44a058e8b3d43959a83862b9cd3ec7bf5b785f"
composer:
  version: 2.11.2
  url: https://getcomposer.org/download/{.composer.version}/composer.phar
  sha256: "dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028"
spc:
  version: 2.8.5
  downloads:
    macos-arm64:
      url: https://github.com/crazywhalecc/static-php-cli/releases/download/{.spc.version}/spc-macos-aarch64.tar.gz
      sha256: "acf2f25d56d0cbf8e65aa82e5054fef555f7be7c5c38046c6e0819f266d83225"
    linux-x64:
      url: https://github.com/crazywhalecc/static-php-cli/releases/download/{.spc.version}/spc-linux-x86_64.tar.gz
      sha256: "523ba4279c54c7a377156c0dd3a36adf92ee64b01e9a7f5e9e2ec084b8e458e5"
    linux-arm64:
      url: https://github.com/crazywhalecc/static-php-cli/releases/download/{.spc.version}/spc-linux-aarch64.tar.gz
      sha256: "675a3840dcdc4ed041fe20eaa54310ce019a9984c1c03951df9ec66df5795213"
  libs: [freetype, libjpeg, libavif, libwebp]
  extensions:
    - bcmath
    - bz2
    - calendar
    - ctype
    - curl
    - dom
    - exif
    - fileinfo
    - filter
    - gd
    - iconv
    - igbinary
    - imagick
    - intl
    - ldap
    - mbstring
    - memcached
    - mongodb
    - msgpack
    - mysqli
    - mysqlnd
    - opcache
    - openssl
    - pcntl
    - pdo
    - pdo_mysql
    - pdo_pgsql
    - pdo_sqlite
    - pgsql
    - phar
    - posix
    - readline
    - redis
    - session
    - simplexml
    - soap
    - sockets
    - sodium
    - sqlite3
    - tokenizer
    - xml
    - xmlreader
    - xmlwriter
    - zip
    - zlib
updates:
  - field: .version
    type: php
    series: "8.5"
  - field: .spc.version
    type: github-release
    repo: crazywhalecc/static-php-cli
  - field: .composer.version
    type: github-release
    repo: composer/composer
